<!doctype html>
<html lang="pt-BR">
  <head>

    <!-- Recursos críticos: começam a baixar junto com o HTML, sem esperar o JavaScript -->
    <link rel="preload" href="/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      as="image"
      href="/images/riquelme-hero-600.webp"

      imagesizes="(min-width: 1024px) 40vw, (min-width: 640px) 38vw, 46vw"

    />

    <!-- Open Graph / redes sociais. Se mudar o domínio, atualize as URLs abaixo. -->
    <link rel="canonical" href="https://riquelmeportfolio.vercel.app/" />
    <meta property="og:url" content="https://riquelmeportfolio.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Riquelme Teixeira" />
    <meta property="og:title" content="Riquelme Teixeira | Desenvolvedor Web & Automações" />

      property="og:description"
      content="Sites, automações e integrações que conectam tecnologia, funcionalidade e eficiência."
    />
    <meta property="og:image" content="https://riquelmeportfolio.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
